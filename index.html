<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>AR Furniture Test</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

#status {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 100;
    background: rgba(255,255,255,.92);
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
}

#products {
    position: fixed;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.product {
    width: 120px;
    padding: 17px 8px;
    border: none;
    border-radius: 14px;
    background: white;
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 3px 12px rgba(0,0,0,.30);
}

.product.selected {
    outline: 4px solid #333;
}

.product:disabled {
    opacity: .4;
}

#instruction {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 100;
    background: white;
    padding: 13px 20px;
    border-radius: 25px;
    font-weight: bold;
    box-shadow: 0 3px 12px rgba(0,0,0,.25);
    white-space: nowrap;
}

#error {
    display: none;
    position: fixed;
    top: 70px;
    left: 12px;
    right: 12px;
    z-index: 200;
    background: #fff0f0;
    color: #900;
    padding: 12px;
    border-radius: 8px;
    font-family: monospace;
    white-space: pre-wrap;
}

</style>

<script type="importmap">
{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<div id="status">
    Loading...
</div>

<div id="products">

    <button
        id="sofaButton"
        class="product"
        data-product="sofa"
        disabled>
        SOFA
    </button>

    <button
        id="tableButton"
        class="product"
        data-product="table"
        disabled>
        TABLE
    </button>

</div>

<div id="instruction">
    Select a product.
</div>

<div id="error"></div>


<script type="module">

import * as THREE from 'three';

import { FBXLoader }
from 'three/addons/loaders/FBXLoader.js';

import { ARButton }
from 'three/addons/webxr/ARButton.js';


/* =====================================================
   BASIC THREE.JS SETUP
   ===================================================== */

const scene = new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });


renderer.setPixelRatio(
    window.devicePixelRatio
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.xr.enabled = true;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHT
   ===================================================== */

const light =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
    );

scene.add(light);


/* =====================================================
   PRODUCT STORAGE
   ===================================================== */

const products = {};

let selectedProduct = null;

let placedObjects = [];


/* =====================================================
   LOAD FBX
   ===================================================== */

function loadFBX(name, filename) {

    const loader = new FBXLoader();

    loader.load(

        filename,

        function(model) {

            /*
             * FBX from your Autodesk workflow is
             * being treated as centimetres.
             *
             * This converts centimetres to metres.
             */

            model.scale.set(
                0.01,
                0.01,
                0.01
            );

            model.visible = false;

            products[name] = model;

            scene.add(model);

            document.getElementById(
                name + "Button"
            ).disabled = false;

            updateStatus();

        },

        function(xhr) {

            if (xhr.total) {

                const p =
                    (xhr.loaded / xhr.total) * 100;

                document.getElementById(
                    "status"
                ).innerText =
                    name.toUpperCase() +
                    " loading " +
                    p.toFixed(0) +
                    "%";

            }

        },

        function(error) {

            showError(
                name.toUpperCase() +
                " FBX FAILED\n\n" +
                String(error)
            );

        }

    );
}


loadFBX(
    "sofa",
    "./sofa.fbx?v=2"
);

loadFBX(
    "table",
    "./table.fbx?v=2"
);


/* =====================================================
   STATUS
   ===================================================== */

function updateStatus() {

    if (
        products.sofa &&
        products.table
    ) {

        document.getElementById(
            "status"
        ).innerText =
            "Both FBX files loaded.";

        document.getElementById(
            "instruction"
        ).innerText =
            "Tap SOFA or TABLE.";

    }

}


/* =====================================================
   ERROR DISPLAY
   ===================================================== */

function showError(message) {

    const box =
        document.getElementById(
            "error"
        );

    box.style.display = "block";

    box.innerText = message;

}


/* =====================================================
   PRODUCT BUTTONS
   ===================================================== */

document
.querySelectorAll(".product")
.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            const name =
                this.dataset.product;

            if (!products[name]) {
                return;
            }

            selectedProduct = name;

            document
            .querySelectorAll(".product")
            .forEach(b => {
                b.classList.remove(
                    "selected"
                );
            });

            this.classList.add(
                "selected"
            );

            document.getElementById(
                "instruction"
            ).innerText =
                "Move phone slowly over floor.";

            document.getElementById(
                "status"
            ).innerText =
                "Searching for a surface...";

        }
    );

});


/* =====================================================
   RETICLE
   ===================================================== */

const reticleGeometry =
    new THREE.RingGeometry(
        0.08,
        0.105,
        32
    );

const reticleMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide
    });

const reticle =
    new THREE.Mesh(
        reticleGeometry,
        reticleMaterial
    );


reticle.rotation.x =
    -Math.PI / 2;

reticle.matrixAutoUpdate =
    false;

reticle.visible =
    false;

scene.add(reticle);


/* =====================================================
   AR BUTTON
   ===================================================== */

const arButton =
    ARButton.createButton(

        renderer,

        {
            requiredFeatures: [
                "hit-test"
            ],

            optionalFeatures: [
                "dom-overlay"
            ],

            domOverlay: {
                root: document.body
            }
        }

    );


document.body.appendChild(
    arButton
);


/* =====================================================
   AR SESSION
   ===================================================== */

let hitTestSource = null;

let viewerReferenceSpace = null;

let localReferenceSpace = null;


/* =====================================================
   SESSION START
   ===================================================== */

renderer.xr.addEventListener(
    "sessionstart",
    async function() {

        try {

            const session =
                renderer.xr.getSession();


            document.getElementById(
                "status"
            ).innerText =
                "AR started. Initialising surface detection...";


            /*
             * Viewer space:
             * follows the phone/camera.
             */

            viewerReferenceSpace =
                await session
                .requestReferenceSpace(
                    "viewer"
                );


            /*
             * Local space:
             * becomes the stable AR world.
             */

            localReferenceSpace =
                await session
                .requestReferenceSpace(
                    "local"
                );


            /*
             * IMPORTANT:
             *
             * Hit testing originates from
             * the camera/viewer and finds
             * real surfaces in front of it.
             */

            hitTestSource =
                await session
                .requestHitTestSource({

                    space:
                        viewerReferenceSpace

                });


            document.getElementById(
                "status"
            ).innerText =
                "Surface detection active.";

            document.getElementById(
                "instruction"
            ).innerText =
                "Move phone slowly over the floor.";

        }

        catch(error) {

            showError(
                "AR INITIALISATION FAILED\n\n" +
                error.message
            );

        }

    }
);


/* =====================================================
   SESSION END
   ===================================================== */

renderer.xr.addEventListener(
    "sessionend",
    function() {

        hitTestSource = null;

        viewerReferenceSpace = null;

        localReferenceSpace = null;

        reticle.visible = false;

        document.getElementById(
            "status"
        ).innerText =
            "AR session ended.";

    }
);


/* =====================================================
   CONTROLLER
   ===================================================== */

const controller =
    renderer.xr.getController(0);

scene.add(controller);


/* =====================================================
   TAP = PLACE
   ===================================================== */

controller.addEventListener(
    "select",
    function() {

        if (!selectedProduct) {

            document.getElementById(
                "instruction"
            ).innerText =
                "Select SOFA or TABLE first.";

            return;
        }


        if (!reticle.visible) {

            document.getElementById(
                "instruction"
            ).innerText =
                "No surface detected yet.";

            return;
        }


        /*
         * Clone the selected FBX.
         */

        const object =
            products[selectedProduct]
            .clone(true);


        object.visible = true;


        /*
         * Copy the exact detected
         * AR-world position.
         */

        object.position.setFromMatrixPosition(
            reticle.matrix
        );


        /*
         * Start at the FBX's converted
         * scale.
         */

        object.scale.set(
            1,
            1,
            1
        );


        /*
         * Keep the object in the scene.
         */

        scene.add(object);

        placedObjects.push(object);


        document.getElementById(
            "status"
        ).innerText =
            selectedProduct.toUpperCase() +
            " PLACED.";

        document.getElementById(
            "instruction"
        ).innerText =
            "Move phone around. Object should stay.";

    }
);


/* =====================================================
   XR RENDER LOOP
   ===================================================== */

renderer.setAnimationLoop(
    function(timestamp, frame) {

        /*
         * No AR frame = normal render.
         */

        if (
            frame &&
            hitTestSource &&
            localReferenceSpace
        ) {

            const results =
                frame.getHitTestResults(
                    hitTestSource
                );


            if (results.length > 0) {

                const hit =
                    results[0];


                const pose =
                    hit.getPose(
                        localReferenceSpace
                    );


                if (pose) {

                    /*
                     * A REAL SURFACE HAS BEEN
                     * DETECTED.
                     */

                    reticle.visible = true;


                    reticle.matrix.fromArray(
                        pose.transform.matrix
                    );


                    document.getElementById(
                        "status"
                    ).innerText =
                        "SURFACE DETECTED — TAP TO PLACE";


                    if (selectedProduct) {

                        document.getElementById(
                            "instruction"
                        ).innerText =
                            "Tap the floor to place " +
                            selectedProduct.toUpperCase();

                    }

                }

            }
            else {

                /*
                 * Nothing detected.
                 */

                reticle.visible = false;

                if (selectedProduct) {

                    document.getElementById(
                        "status"
                    ).innerText =
                        "Searching for surface...";

                }

            }

        }


        renderer.render(
            scene,
            camera
        );

    }
);


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
