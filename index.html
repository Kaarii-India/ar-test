<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Furniture AR</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #222;
    font-family: Arial, sans-serif;
}

#status {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 20;

    background: white;
    padding: 9px 12px;

    border-radius: 8px;

    font-size: 13px;

    box-shadow: 0 2px 10px rgba(0,0,0,.2);
}

#products {
    position: fixed;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);

    z-index: 20;

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.product {
    width: 100px;

    padding: 16px 8px;

    border: none;
    border-radius: 12px;

    background: white;

    font-weight: bold;
    font-size: 15px;

    box-shadow: 0 3px 12px rgba(0,0,0,.3);
}

.product.selected {
    outline: 4px solid #333;
}

.product:disabled {
    opacity: .4;
}

#instruction {
    position: fixed;

    left: 50%;
    bottom: 22px;

    transform: translateX(-50%);

    z-index: 20;

    background: white;

    padding: 12px 18px;

    border-radius: 24px;

    font-weight: bold;

    box-shadow: 0 3px 12px rgba(0,0,0,.25);

    white-space: nowrap;
}

#error {
    display: none;

    position: fixed;

    top: 65px;
    left: 12px;
    right: 12px;

    z-index: 30;

    background: #fff0f0;
    color: #900;

    padding: 14px;

    border-radius: 8px;

    font-family: monospace;

    white-space: pre-wrap;
}

</style>


<script type="importmap">
{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }
}
</script>

</head>


<body>


<div id="status">
    Loading products...
</div>


<div id="products">

    <button
        id="sofaButton"
        class="product"
        data-product="sofa"
        disabled>
        SOFA
    </button>

    <button
        id="tableButton"
        class="product"
        data-product="table"
        disabled>
        TABLE
    </button>

</div>


<div id="instruction">
    Enter AR and select a product.
</div>


<div id="error"></div>


<script type="module">


import * as THREE from 'three';

import { FBXLoader }
from 'three/addons/loaders/FBXLoader.js';

import { ARButton }
from 'three/addons/webxr/ARButton.js';


// =====================================================
// SCENE
// =====================================================

const scene =
    new THREE.Scene();


// =====================================================
// CAMERA
// =====================================================

const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        0.01,
        10000
    );


// =====================================================
// RENDERER
// =====================================================

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: true

    });


renderer.setPixelRatio(
    window.devicePixelRatio
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.xr.enabled =
    true;

document.body.appendChild(
    renderer.domElement
);


// =====================================================
// LIGHT
// =====================================================

scene.add(

    new THREE.HemisphereLight(
        0xffffff,
        0x555555,
        3
    )

);

const directionalLight =
    new THREE.DirectionalLight(
        0xffffff,
        4
    );

directionalLight.position.set(
    5,
    10,
    5
);

scene.add(
    directionalLight
);


// =====================================================
// PRODUCTS
// =====================================================

const products = {};


// Currently selected source model

let selectedProduct = null;


// Currently selected placed object

let activeObject = null;


// =====================================================
// LOAD FBX
// =====================================================

function loadProduct(
    name,
    filename
) {

    const loader =
        new FBXLoader();


    loader.load(

        filename,


        function(model) {

            console.log(
                name,
                "loaded"
            );


            /*
                IMPORTANT:

                No assumed furniture dimensions.

                We preserve the model's proportions
                and coordinate system.

                Initial scale is deliberately 1.
            */

            model.scale.set(
                1,
                1,
                1
            );


            model.visible =
                false;


            products[name] =
                model;


            scene.add(
                model
            );


            document.getElementById(
                name + "Button"
            ).disabled =
                false;


            updateStatus();

        },


        function(xhr) {

            if (xhr.total) {

                document.getElementById(
                    "status"
                ).innerText =

                    name.toUpperCase() +
                    " loading " +

                    (
                        xhr.loaded /
                        xhr.total *
                        100
                    ).toFixed(0) +
                    "%";

            }

        },


        function(error) {

            console.error(
                name,
                error
            );


            const errorBox =
                document.getElementById(
                    "error"
                );


            errorBox.style.display =
                "block";


            errorBox.innerText +=

                name.toUpperCase() +
                " FAILED\n\n" +

                (
                    error.message ||
                    String(error)
                ) +

                "\n\n";

        }

    );

}


// =====================================================
// LOAD BOTH
// =====================================================

loadProduct(
    "sofa",
    "./sofa.fbx"
);

loadProduct(
    "table",
    "./table.fbx"
);


// =====================================================
// STATUS
// =====================================================

function updateStatus() {

    if (
        products.sofa &&
        products.table
    ) {

        document.getElementById(
            "status"
        ).innerText =
            "SOFA + TABLE ready";

    }

}


// =====================================================
// PRODUCT SELECTION
// =====================================================

document
.querySelectorAll(".product")
.forEach(

    button => {

        button.addEventListener(
            "click",

            function() {

                const name =
                    this.dataset.product;


                if (
                    !products[name]
                ) {

                    return;

                }


                selectedProduct =
                    products[name];


                document
                .querySelectorAll(".product")
                .forEach(

                    b => {

                        b.classList.remove(
                            "selected"
                        );

                    }

                );


                this.classList.add(
                    "selected"
                );


                document.getElementById(
                    "instruction"
                ).innerText =

                    "Tap the AR view to place " +
                    name.toUpperCase();

            }

        );

    }

);


// =====================================================
// AR BUTTON
// =====================================================

const arButton =
    ARButton.createButton(

        renderer,

        {

            optionalFeatures: [
                "dom-overlay"
            ],

            domOverlay: {
                root: document.body
            }

        }

    );


document.body.appendChild(
    arButton
);


// =====================================================
// XR CONTROLLER
// =====================================================

const controller =
    renderer.xr.getController(
        0
    );

scene.add(
    controller
);


// =====================================================
// PLACE OBJECT
// =====================================================

controller.addEventListener(

    "select",

    function() {


        if (
            !selectedProduct
        ) {

            document.getElementById(
                "instruction"
            ).innerText =
                "Select SOFA or TABLE first.";

            return;

        }


        /*
            Clone the source model.

            Every placement becomes
            an independent object.
        */

        const object =
            selectedProduct.clone(
                true
            );


        object.visible =
            true;


        /*
            Start 1 metre in front
            of the AR camera.
        */

        const direction =
            new THREE.Vector3();


        camera.getWorldDirection(
            direction
        );


        direction.y = 0;


        if (
            direction.lengthSq() < 0.000001
        ) {

            direction.set(
                0,
                0,
                -1
            );

        }


        direction.normalize();


        const cameraPosition =
            camera.getWorldPosition(
                new THREE.Vector3()
            );


        object.position.copy(
            cameraPosition
        );


        object.position.add(
            direction.multiplyScalar(
                1
            )
        );


        /*
            Remember this object.

            It will become the object
            that the user can manipulate.
        */

        activeObject =
            object;


        scene.add(
            object
        );


        document.getElementById(
            "instruction"
        ).innerText =

            "Placed. Pinch = resize • Twist = rotate • Drag = move";

    }

);


// =====================================================
// TOUCH / GESTURE CONTROL
// =====================================================

let touches = {};

let previousDistance = null;

let previousAngle = null;


// -----------------------------------------------------
// TOUCH START
// -----------------------------------------------------

renderer.domElement.addEventListener(

    "touchstart",

    function(event) {

        if (
            !activeObject
        ) {
            return;
        }


        for (
            const touch of event.changedTouches
        ) {

            touches[touch.identifier] = {
                x: touch.clientX,
                y: touch.clientY
            };

        }


        if (
            Object.keys(touches).length === 2
        ) {

            const points =
                Object.values(touches);


            previousDistance =
                distance(
                    points[0],
                    points[1]
                );


            previousAngle =
                angle(
                    points[0],
                    points[1]
                );

        }

    },

    {
        passive: false
    }

);


// -----------------------------------------------------
// TOUCH MOVE
// -----------------------------------------------------

renderer.domElement.addEventListener(

    "touchmove",

    function(event) {

        if (
            !activeObject
        ) {
            return;
        }


        event.preventDefault();


        for (
            const touch of event.changedTouches
        ) {

            if (
                touches[touch.identifier]
            ) {

                touches[touch.identifier].x =
                    touch.clientX;

                touches[touch.identifier].y =
                    touch.clientY;

            }

        }


        const points =
            Object.values(touches);


        // ---------------------------------------------
        // ONE FINGER
        // ---------------------------------------------

        if (
            points.length === 1
        ) {

            /*
                Move object relative to
                finger movement.

                This is deliberately a simple
                first-stage implementation.
            */

            const point =
                points[0];


            const previous =
                point.previous;


            if (
                previous
            ) {

                const dx =
                    point.x -
                    previous.x;

                const dy =
                    point.y -
                    previous.y;


                const movement =
                    0.003;


                activeObject.position.x +=
                    dx * movement;


                activeObject.position.z +=
                    dy * movement;

            }


            point.previous = {
                x: point.x,
                y: point.y
            };


        }


        // ---------------------------------------------
        // TWO FINGERS
        // ---------------------------------------------

        if (
            points.length === 2
        ) {

            const distanceNow =
                distance(
                    points[0],
                    points[1]
                );


            const angleNow =
                angle(
                    points[0],
                    points[1]
                );


            // -----------------------------------------
            // PINCH = SCALE
            // -----------------------------------------

            if (
                previousDistance
            ) {

                const scaleChange =
                    distanceNow /
                    previousDistance;


                activeObject.scale.multiplyScalar(
                    scaleChange
                );


                /*
                    Prevent accidentally making
                    the object disappear completely.
                */

                activeObject.scale.x =
                    THREE.MathUtils.clamp(
                        activeObject.scale.x,
                        0.01,
                        100
                    );

                activeObject.scale.y =
                    activeObject.scale.x;

                activeObject.scale.z =
                    activeObject.scale.x;

            }


            // -----------------------------------------
            // TWIST = ROTATION
            // -----------------------------------------

            if (
                previousAngle !== null
            ) {

                let delta =
                    angleNow -
                    previousAngle;


                /*
                    Keep angle within
                    -PI to PI.
                */

                if (
                    delta > Math.PI
                ) {
                    delta -=
                        Math.PI * 2;
                }

                if (
                    delta < -Math.PI
                ) {
                    delta +=
                        Math.PI * 2;
                }


                activeObject.rotation.y +=
                    delta;

            }


            previousDistance =
                distanceNow;

            previousAngle =
                angleNow;

        }

    },

    {
        passive: false
    }

);


// -----------------------------------------------------
// TOUCH END
// -----------------------------------------------------

renderer.domElement.addEventListener(

    "touchend",

    function(event) {

        for (
            const touch of event.changedTouches
        ) {

            delete touches[
                touch.identifier
            ];

        }


        if (
            Object.keys(touches).length < 2
        ) {

            previousDistance =
                null;

            previousAngle =
                null;

        }

    },

    {
        passive: false
    }

);


// -----------------------------------------------------
// DISTANCE
// -----------------------------------------------------

function distance(
    a,
    b
) {

    const dx =
        a.x -
        b.x;

    const dy =
        a.y -
        b.y;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


// -----------------------------------------------------
// ANGLE
// -----------------------------------------------------

function angle(
    a,
    b
) {

    return Math.atan2(
        b.y - a.y,
        b.x - a.x
    );

}


// =====================================================
// XR SESSION
// =====================================================

renderer.xr.addEventListener(
    "sessionstart",
    function() {

        document.getElementById(
            "status"
        ).style.display =
            "none";


        document.getElementById(
            "instruction"
        ).innerText =
            "Select SOFA or TABLE.";

    }
);


renderer.xr.addEventListener(
    "sessionend",
    function() {

        document.getElementById(
            "status"
        ).style.display =
            "block";

    }
);


// =====================================================
// RENDER
// =====================================================

renderer.setAnimationLoop(
    function() {

        renderer.render(
            scene,
            camera
        );

    }
);


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>

</html>
