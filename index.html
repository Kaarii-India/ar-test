<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Furniture Test</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        model-viewer {
            width: 100%;
            height: 100vh;
            background: #f5f5f5;
        }

        #ar-button {
            background: white;
            border: none;
            border-radius: 30px;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

<model-viewer
    src="model.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    ar-placement="floor"
    alt="3D furniture model">

    <button slot="ar-button" id="ar-button">
        View in your space
    </button>

</model-viewer>

</body>
</html>
