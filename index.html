<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR Furniture Test</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #222;
    font-family: Arial, sans-serif;
}

#products {
    position: fixed;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;

    display: flex;
    flex-direction: column;
    gap: 12px;
}

.product {
    width: 100px;
    padding: 16px 8px;

    border: none;
    border-radius: 12px;

    background: white;

    font-weight: bold;
    font-size: 15px;

    box-shadow: 0 3px 12px rgba(0,0,0,.3);
}

.product.selected {
    outline: 4px solid #333;
}

#instruction {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 20;

    background: white;
    padding: 13px 20px;

    border-radius: 25px;

    font-weight: bold;

    box-shadow: 0 3px 12px rgba(0,0,0,.25);

    white-space: nowrap;
}

#status {
    position: fixed;
    top: 15px;
    left: 15px;

    z-index: 20;

    background: white;
    padding: 10px 14px;

    border-radius: 8px;

    font-size: 13px;

    box-shadow: 0 2px 10px rgba(0,0,0,.2);
}

#error {
    display: none;

    position: fixed;
    top: 70px;
    left: 15px;
    right: 15px;

    z-index: 30;

    background: #fff0f0;
    color: #900;

    padding: 15px;

    border-radius: 8px;

    font-family: monospace;

    white-space: pre-wrap;
}

</style>


<script type="importmap">
{
    "imports": {
        "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

</head>


<body>


<div id="status">
    Loading products...
</div>


<div id="products">

    <button class="product" data-product="sofa">
        SOFA
    </button>

    <button class="product" data-product="table">
        TABLE
    </button>

</div>


<div id="instruction">
    Tap SOFA or TABLE, then tap the screen to place.
</div>


<div id="error"></div>


<script type="module">

import * as THREE from 'three';

import { FBXLoader }
from 'three/addons/loaders/FBXLoader.js';

import { ARButton }
from 'three/addons/webxr/ARButton.js';


// =====================================================
// SCENE
// =====================================================

const scene =
    new THREE.Scene();


// =====================================================
// CAMERA
// =====================================================

const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        0.01,
        10000
    );


// =====================================================
// RENDERER
// =====================================================

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,
        alpha: true

    });

renderer.setPixelRatio(
    window.devicePixelRatio
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.xr.enabled =
    true;

document.body.appendChild(
    renderer.domElement
);


// =====================================================
// LIGHTING
// =====================================================

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x555555,
        3
    )
);

const directional =
    new THREE.DirectionalLight(
        0xffffff,
        4
    );

directional.position.set(
    5,
    10,
    5
);

scene.add(
    directional
);


// =====================================================
// PRODUCT STORAGE
// =====================================================

const products = {};

let selectedProduct = null;


// =====================================================
// PREPARE MODEL
// =====================================================

function prepareModel(model) {

    /*
        Autodesk furniture is normally
        exported in millimetres.

        Convert mm → metres.
    */

    model.scale.set(
        0.001,
        0.001,
        0.001
    );


    /*
        Find bottom of model and move
        its origin to the bottom.
    */

    const box =
        new THREE.Box3()
            .setFromObject(model);


    model.position.y -=
        box.min.y;


    return model;
}


// =====================================================
// LOAD PRODUCT
// =====================================================

function loadProduct(
    name,
    filename
) {

    const loader =
        new FBXLoader();


    loader.load(

        filename,


        function(model) {

            console.log(
                name +
                " loaded"
            );


            prepareModel(
                model
            );


            products[name] =
                model;


            /*
                Source model stays hidden.

                We clone it every time
                the user places a product.
            */

            model.visible =
                false;


            scene.add(
                model
            );


            updateStatus();

        },


        function(xhr) {

            if (xhr.total) {

                document.getElementById(
                    "status"
                ).innerText =
                    name.toUpperCase() +
                    " loading " +
                    (
                        xhr.loaded /
                        xhr.total *
                        100
                    ).toFixed(0) +
                    "%";

            }

        },


        function(error) {

            console.error(
                name +
                " ERROR",
                error
            );


            document.getElementById(
                "error"
            ).style.display =
                "block";


            document.getElementById(
                "error"
            ).innerText +=
                name.toUpperCase() +
                " FAILED\n\n" +
                (
                    error.message ||
                    String(error)
                ) +
                "\n\n";

        }

    );

}


// =====================================================
// LOAD BOTH
// =====================================================

loadProduct(
    "sofa",
    "./sofa.fbx"
);

loadProduct(
    "table",
    "./table.fbx"
);


// =====================================================
// STATUS
// =====================================================

function updateStatus() {

    const loaded =
        Object.keys(products)
            .length;


    if (loaded === 2) {

        document.getElementById(
            "status"
        ).innerText =
            "SOFA + TABLE ready";

    }
}


// =====================================================
// PRODUCT SELECTION
// =====================================================

document
.querySelectorAll(".product")
.forEach(
    button => {

        button.addEventListener(
            "click",
            function() {

                const name =
                    this.dataset.product;


                if (!products[name]) {

                    document.getElementById(
                        "status"
                    ).innerText =
                        name.toUpperCase() +
                        " is still loading.";

                    return;

                }


                selectedProduct =
                    products[name];


                document
                .querySelectorAll(".product")
                .forEach(
                    b => {

                        b.classList.remove(
                            "selected"
                        );

                    }
                );


                this.classList.add(
                    "selected"
                );


                document.getElementById(
                    "instruction"
                ).innerText =
                    "Now tap the screen to place " +
                    name.toUpperCase();

            }

        );

    }
);


// =====================================================
// AR BUTTON
// =====================================================

const arButton =
    ARButton.createButton(
        renderer,
        {

            /*
                IMPORTANT:

                NO hit-test.

                We are deliberately not
                using floor detection yet.
            */

            optionalFeatures: [
                "dom-overlay"
            ],

            domOverlay: {
                root: document.body
            }

        }
    );


document.body.appendChild(
    arButton
);


// =====================================================
// AR CONTROLLER
// =====================================================

const controller =
    renderer.xr.getController(
        0
    );

scene.add(
    controller
);


// =====================================================
// PLACE PRODUCT
// =====================================================

controller.addEventListener(
    "select",
    function() {

        if (!selectedProduct) {

            document.getElementById(
                "instruction"
            ).innerText =
                "Select SOFA or TABLE first.";

            return;

        }


        /*
            Make a new copy.

            This means previously placed
            products remain in the room.
        */

        const object =
            selectedProduct.clone(
                true
            );


        object.visible =
            true;


        /*
            Put object approximately
            1 metre in front of camera.
        */

        const direction =
            new THREE.Vector3();


        camera.getWorldDirection(
            direction
        );


        const position =
            camera.position.clone();


        position.add(
            direction.multiplyScalar(
                1.0
            )
        );


        /*
            Put object approximately
            at floor level.

            We assume the phone is
            being held around 1.2m
            above the floor.
        */

        position.y -=
            1.2;


        object.position.copy(
            position
        );


        /*
            Make sure object rotation
            follows the horizontal
            direction of the camera.
        */

        object.rotation.y =
            camera.rotation.y;


        scene.add(
            object
        );


        document.getElementById(
            "instruction"
        ).innerText =
            "Placed! Select another product.";

    }
);


// =====================================================
// AR SESSION START
// =====================================================

renderer.xr.addEventListener(
    "sessionstart",
    function() {

        document.getElementById(
            "status"
        ).style.display =
            "none";

        document.getElementById(
            "instruction"
        ).innerText =
            "Select SOFA or TABLE, then tap the screen.";

    }
);


// =====================================================
// AR SESSION END
// =====================================================

renderer.xr.addEventListener(
    "sessionend",
    function() {

        document.getElementById(
            "status"
        ).style.display =
            "block";

    }
);


// =====================================================
// RENDER LOOP
// =====================================================

renderer.setAnimationLoop(
    function() {

        renderer.render(
            scene,
            camera
        );

    }
);


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
