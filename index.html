<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>AR Furniture Test</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

#status {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 100;
    background: rgba(255,255,255,.94);
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
}

#products {
    position: fixed;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.product {
    width: 120px;
    padding: 17px 8px;
    border: none;
    border-radius: 14px;
    background: white;
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 3px 12px rgba(0,0,0,.30);
}

.product.selected {
    outline: 4px solid #333;
}

.product:disabled {
    opacity: .4;
}

#instruction {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 100;
    background: white;
    padding: 14px 20px;
    border-radius: 25px;
    font-weight: bold;
    box-shadow: 0 3px 12px rgba(0,0,0,.25);
    white-space: nowrap;
}

#error {
    display: none;
    position: fixed;
    top: 70px;
    left: 12px;
    right: 12px;
    z-index: 200;
    background: #fff0f0;
    color: #900;
    padding: 14px;
    border-radius: 8px;
    font-family: monospace;
    white-space: pre-wrap;
}

</style>


<script type="importmap">
{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

</head>


<body>


<div id="status">
    Loading...
</div>


<div id="products">

    <button
        id="sofaButton"
        class="product"
        data-product="sofa"
        disabled>
        SOFA
    </button>

    <button
        id="tableButton"
        class="product"
        data-product="table"
        disabled>
        TABLE
    </button>

</div>


<div id="instruction">
    Select a product.
</div>


<div id="error"></div>


<script type="module">


import * as THREE from 'three';

import { FBXLoader }
from 'three/addons/loaders/FBXLoader.js';

import { ARButton }
from 'three/addons/webxr/ARButton.js';



/* =====================================================
   THREE.JS
   ===================================================== */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(

        70,

        window.innerWidth /
        window.innerHeight,

        0.01,

        1000

    );


const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        alpha: true

    });


renderer.setPixelRatio(
    window.devicePixelRatio
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.xr.enabled =
    true;


document.body.appendChild(
    renderer.domElement
);



/* =====================================================
   LIGHTING
   ===================================================== */

scene.add(

    new THREE.HemisphereLight(

        0xffffff,
        0x444444,
        3

    )

);



/* =====================================================
   PRODUCTS
   ===================================================== */

const products = {};

let selectedProduct = null;


/* =====================================================
   LOAD FBX
   ===================================================== */

function loadFBX(
    name,
    filename
) {

    const loader =
        new FBXLoader();


    loader.load(

        filename,

        function(model) {

            /*
             * Autodesk FBX is being treated
             * as centimetres.
             *
             * Convert cm → metres.
             */

            model.scale.set(

                0.01,
                0.01,
                0.01

            );


            model.visible =
                false;


            products[name] =
                model;


            scene.add(model);


            document.getElementById(
                name + "Button"
            ).disabled =
                false;


            updateStatus();

        },

        function(xhr) {

            if (xhr.total) {

                const percent =

                    (
                        xhr.loaded /
                        xhr.total
                    ) * 100;


                document.getElementById(
                    "status"
                ).innerText =

                    name.toUpperCase() +
                    " loading " +
                    percent.toFixed(0) +
                    "%";

            }

        },

        function(error) {

            showError(

                name.toUpperCase() +
                " FBX FAILED\n\n" +

                String(error)

            );

        }

    );

}


/*
 * Cache-busting is intentional.
 *
 * If you replace sofa.fbx again,
 * change ?v=2 to ?v=3.
 */

loadFBX(
    "sofa",
    "./sofa.fbx?v=2"
);


loadFBX(
    "table",
    "./table.fbx?v=2"
);



/* =====================================================
   STATUS
   ===================================================== */

function updateStatus() {

    if (

        products.sofa &&
        products.table

    ) {

        document.getElementById(
            "status"
        ).innerText =
            "Both products loaded.";

        document.getElementById(
            "instruction"
        ).innerText =
            "Tap SOFA or TABLE.";

    }

}


/* =====================================================
   ERROR
   ===================================================== */

function showError(message) {

    const box =
        document.getElementById(
            "error"
        );

    box.style.display =
        "block";

    box.innerText =
        message;

}



/* =====================================================
   PRODUCT SELECTION
   ===================================================== */

document
.querySelectorAll(".product")
.forEach(

    button => {

        button.addEventListener(

            "click",

            function() {

                const name =
                    this.dataset.product;


                if (!products[name]) {

                    return;

                }


                selectedProduct =
                    name;


                document
                .querySelectorAll(".product")
                .forEach(

                    b => {

                        b.classList.remove(
                            "selected"
                        );

                    }

                );


                this.classList.add(
                    "selected"
                );


                document.getElementById(
                    "status"
                ).innerText =

                    "Touch the floor where you want the " +
                    name.toUpperCase();


                document.getElementById(
                    "instruction"
                ).innerText =

                    "Tap the floor to place " +
                    name.toUpperCase();

            }

        );

    }

);



/* =====================================================
   RETICLE
   ===================================================== */

const reticle =

    new THREE.Mesh(

        new THREE.RingGeometry(

            0.08,
            0.105,
            32

        ),

        new THREE.MeshBasicMaterial({

            color: 0xffffff,

            side:
                THREE.DoubleSide

        })

    );


reticle.rotation.x =
    -Math.PI / 2;


reticle.matrixAutoUpdate =
    false;


reticle.visible =
    false;


scene.add(
    reticle
);



/* =====================================================
   AR BUTTON
   ===================================================== */

const arButton =

    ARButton.createButton(

        renderer,

        {

            requiredFeatures: [

                "local",
                "hit-test"

            ],

            optionalFeatures: [

                "dom-overlay"

            ],

            domOverlay: {

                root:
                    document.body

            }

        }

    );


document.body.appendChild(
    arButton
);



/* =====================================================
   AR VARIABLES
   ===================================================== */

let session = null;

let localReferenceSpace = null;

let viewerReferenceSpace = null;


/*
 * Normal continuous hit-test.
 */

let regularHitTestSource =
    null;


/*
 * Touchscreen hit-test.
 */

let transientHitTestSource =
    null;


/*
 * Most recent valid touch result.
 */

let lastTouchPose =
    null;


/*
 * Most recent normal hit result.
 */

let lastRegularPose =
    null;


/*
 * Most recent touch timestamp.
 */

let lastTouchTime =
    0;



/* =====================================================
   AR SESSION START
   ===================================================== */

renderer.xr.addEventListener(

    "sessionstart",

    async function() {

        try {

            session =
                renderer.xr.getSession();


            document.getElementById(
                "status"
            ).innerText =
                "AR started. Preparing touch placement...";


            /*
             * Stable AR world.
             */

            localReferenceSpace =

                await session
                .requestReferenceSpace(
                    "local"
                );


            /*
             * Viewer space for normal
             * hit testing.
             */

            viewerReferenceSpace =

                await session
                .requestReferenceSpace(
                    "viewer"
                );


            /*
             * Normal continuous hit test.
             */

            regularHitTestSource =

                await session
                .requestHitTestSource({

                    space:
                        viewerReferenceSpace,

                    entityTypes: [

                        "plane"

                    ]

                });


            /*
             * =================================================
             * TOUCHSCREEN HIT TEST
             * =================================================
             *
             * This is the important new part.
             *
             * The browser calculates the ray from the
             * actual touchscreen touch location.
             *
             * We don't have to guess where that point
             * exists in 3D.
             */

            if (

                typeof session
                .requestHitTestSourceForTransientInput
                === "function"

            ) {

                transientHitTestSource =

                    await session
                    .requestHitTestSourceForTransientInput({

                        profile:
                            "generic-touchscreen",

                        entityTypes: [

                            "plane"

                        ]

                    });


                document.getElementById(
                    "status"
                ).innerText =

                    "Touch placement ready.";

            }

            else {

                /*
                 * This tells us immediately if the
                 * phone/browser doesn't expose the
                 * transient touchscreen API.
                 */

                document.getElementById(
                    "status"
                ).innerText =

                    "Touch hit-test unavailable on this browser.";

            }


            document.getElementById(
                "instruction"
            ).innerText =

                "Select SOFA or TABLE.";

        }

        catch(error) {

            showError(

                "AR SETUP ERROR\n\n" +

                error.message

            );

        }

    }

);



/* =====================================================
   AR SESSION END
   ===================================================== */

renderer.xr.addEventListener(

    "sessionend",

    function() {

        if (
            regularHitTestSource
        ) {

            regularHitTestSource.cancel();

        }


        if (
            transientHitTestSource
        ) {

            transientHitTestSource.cancel();

        }


        session =
            null;


        regularHitTestSource =
            null;


        transientHitTestSource =
            null;


        lastTouchPose =
            null;


        lastRegularPose =
            null;


        reticle.visible =
            false;

    }

);



/* =====================================================
   CONTROLLER
   ===================================================== */

const controller =
    renderer.xr.getController(0);


scene.add(
    controller
);



/* =====================================================
   SELECT EVENT
   ===================================================== */

controller.addEventListener(

    "select",

    function() {

        /*
         * We normally won't use this event
         * for placement.
         *
         * The touchscreen hit-test below
         * handles placement directly.
         */

    }

);



/* =====================================================
   TOUCHSCREEN HIT TEST
   ===================================================== */

function processTouchHitTest(frame) {

    if (
        !transientHitTestSource
    ) {

        return;

    }


    /*
     * Get results for the touchscreen
     * input source.
     */

    const results =

        frame.getHitTestResultsForTransientInput(

            transientHitTestSource

        );


    if (
        !results ||
        results.length === 0
    ) {

        return;

    }


    /*
     * There may be more than one
     * transient input source.
     *
     * We use the first one.
     */

    const inputResult =
        results[0];


    if (
        !inputResult.results ||
        inputResult.results.length === 0
    ) {

        return;

    }


    /*
     * First result is the closest
     * detected surface.
     */

    const hit =
        inputResult.results[0];


    const pose =
        hit.getPose(
            localReferenceSpace
        );


    if (
        !pose
    ) {

        return;

    }


    /*
     * Save the pose.

     * This is the EXACT real-world point
     * touched by the user.
     */

    lastTouchPose =
        pose;


    lastTouchTime =
        performance.now();


    /*
     * Show the placement marker.
     */

    reticle.visible =
        true;


    reticle.matrix.fromArray(
        pose.transform.matrix
    );


    if (
        selectedProduct
    ) {

        document.getElementById(
            "status"
        ).innerText =

            "SURFACE FOUND — RELEASE TO PLACE";


        document.getElementById(
            "instruction"
        ).innerText =

            "Release your finger to place " +
            selectedProduct.toUpperCase();

    }

}



/* =====================================================
   PLACE OBJECT
   ===================================================== */

function placeSelectedObject(pose) {

    if (
        !selectedProduct ||
        !pose
    ) {

        return;

    }


    const source =
        products[selectedProduct];


    if (
        !source
    ) {

        return;

    }


    /*
     * Create independent copy.
     */

    const object =
        source.clone(true);


    object.visible =
        true;


    /*
     * Copy exact world position.
     */

    object.position.setFromMatrixPosition(

        new THREE.Matrix4()
        .fromArray(
            pose.transform.matrix
        )

    );


    /*
     * Copy orientation from the AR
     * surface pose.

     * But we only want the floor's
     * horizontal orientation.

     */

    const matrix =
        new THREE.Matrix4()
        .fromArray(
            pose.transform.matrix
        );


    const quaternion =
        new THREE.Quaternion();


    quaternion.setFromRotationMatrix(
        matrix
    );


    object.quaternion.copy(
        quaternion
    );


    /*
     * Add object to AR scene.
     */

    scene.add(
        object
    );


    /*
     * Make it the current object.
     */

    object.userData.product =
        selectedProduct;


    object.userData.arPlaced =
        true;


    /*
     * Clear placement marker.
     */

    reticle.visible =
        false;


    /*
     * IMPORTANT:
     *
     * We do NOT update this object's
     * position every frame.
     *
     * Therefore it remains where it
     * was physically placed.
     */

    document.getElementById(
        "status"
    ).innerText =

        selectedProduct.toUpperCase() +
        " PLACED";


    document.getElementById(
        "instruction"
    ).innerText =

        "Object placed. Select another product.";

}



/* =====================================================
   TOUCH START
   ===================================================== */

renderer.domElement.addEventListener(

    "touchstart",

    function() {

        /*
         * Clear the previous touch result
         * so an old position cannot be reused.
         */

        lastTouchPose =
            null;


        lastTouchTime =
            performance.now();

    },

    {
        passive: true
    }

);



/* =====================================================
   TOUCH END
   ===================================================== */

renderer.domElement.addEventListener(

    "touchend",

    function() {

        /*
         * Give the XR frame a tiny amount
         * of time to deliver the final
         * touchscreen hit-test result.
         */

        setTimeout(

            function() {

                if (
                    lastTouchPose &&
                    performance.now() -
                    lastTouchTime
                    < 500
                ) {

                    placeSelectedObject(
                        lastTouchPose
                    );

                }

                else {

                    document.getElementById(
                        "status"
                    ).innerText =

                        "No surface found at that touch.";

                }

            },

            50

        );

    },

    {
        passive: true
    }

);



/* =====================================================
   XR FRAME LOOP
   ===================================================== */

renderer.setAnimationLoop(

    function(

        timestamp,
        frame

    ) {


        if (
            frame
        ) {


            /*
             * ---------------------------------------------
             * NORMAL HIT TEST
             * ---------------------------------------------
             */

            if (

                regularHitTestSource &&
                localReferenceSpace

            ) {

                const results =

                    frame.getHitTestResults(
                        regularHitTestSource
                    );


                if (
                    results.length > 0
                ) {

                    const pose =

                        results[0].getPose(
                            localReferenceSpace
                        );


                    if (
                        pose
                    ) {

                        lastRegularPose =
                            pose;


                        /*
                         * Only show the normal
                         * reticle when we don't
                         * already have a touch
                         * result.
                         */

                        if (
                            !lastTouchPose
                        ) {

                            reticle.visible =
                                true;


                            reticle.matrix
                                .fromArray(
                                    pose.transform.matrix
                                );

                        }

                    }

                }

            }



            /*
             * ---------------------------------------------
             * TOUCH HIT TEST
             * ---------------------------------------------
             */

            if (
                transientHitTestSource
            ) {

                processTouchHitTest(
                    frame
                );

            }

        }


        renderer.render(
            scene,
            camera
        );

    }

);



/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(

    "resize",

    function() {

        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);


</script>

</body>

</html>
