<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Furniture Test</title>

    <script
        type="module"
        src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            display: block;
            background: #eeeeee;
        }

        #ar-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);

            padding: 15px 25px;
            border: none;
            border-radius: 30px;

            background: white;
            color: #222;

            font-size: 16px;
            font-weight: bold;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body>

    <model-viewer
        src="./model.glb"
        alt="Sofa"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        ar
        ar-modes="webxr scene-viewer quick-look">

        <button slot="ar-button" id="ar-button">
            View in your space
        </button>

    </model-viewer>

</body>

</html>
