<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Furniture Test</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #222;
    }

    #info {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 20;
        background: white;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
    }

    #products {
        position: fixed;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 20;

        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .product {
        width: 90px;
        padding: 15px 8px;

        border: none;
        border-radius: 10px;

        background: white;

        font-weight: bold;
        font-size: 14px;

        box-shadow: 0 3px 10px rgba(0,0,0,.25);
    }

    .product.selected {
        outline: 3px solid #333;
    }

    #instruction {
        display: none;

        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);

        z-index: 20;

        background: white;
        padding: 12px 18px;

        border-radius: 25px;

        font-weight: bold;

        box-shadow: 0 3px 12px rgba(0,0,0,.25);

        white-space: nowrap;
    }

    #error {
        display: none;

        position: fixed;
        top: 70px;
        left: 15px;
        right: 15px;

        z-index: 30;

        background: #fff0f0;
        color: #900;

        padding: 15px;

        border-radius: 8px;

        font-family: monospace;

        white-space: pre-wrap;
    }
</style>

<script type="importmap">
{
    "imports": {
        "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>
</head>

<body>

<div id="info">
    Loading products...
</div>

<div id="products">

    <button class="product" data-product="sofa">
        SOFA
    </button>

    <button class="product" data-product="table">
        TABLE
    </button>

</div>

<div id="instruction">
    Move your phone until the floor is detected.
</div>

<div id="error"></div>


<script type="module">

import * as THREE from 'three';

import { FBXLoader }
from 'three/addons/loaders/FBXLoader.js';

import { ARButton }
from 'three/addons/webxr/ARButton.js';


// =====================================================
// SCENE
// =====================================================

const scene =
    new THREE.Scene();


// =====================================================
// CAMERA
// =====================================================

const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        0.01,
        10000
    );


// =====================================================
// RENDERER
// =====================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });

renderer.setPixelRatio(
    window.devicePixelRatio
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.xr.enabled = true;

document.body.appendChild(
    renderer.domElement
);


// =====================================================
// LIGHTS
// =====================================================

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x555555,
        3
    )
);

const directional =
    new THREE.DirectionalLight(
        0xffffff,
        4
    );

directional.position.set(
    5, 10, 5
);

scene.add(
    directional
);


// =====================================================
// PRODUCT STORAGE
// =====================================================

const products = {};

let selectedProduct = null;


// =====================================================
// LOAD PRODUCT
// =====================================================

function loadProduct(
    name,
    filename
) {

    const loader =
        new FBXLoader();

    loader.load(

        filename,

        function(model) {

            console.log(
                name +
                " loaded"
            );

            // -----------------------------------------
            // SCALE
            // -----------------------------------------

            model.scale.set(
                0.001,
                0.001,
                0.001
            );


            // -----------------------------------------
            // HIDE UNTIL SELECTED
            // -----------------------------------------

            model.visible = false;


            // -----------------------------------------
            // STORE
            // -----------------------------------------

            products[name] =
                model;

            scene.add(
                model
            );


            document.getElementById(
                "info"
            ).innerText =
                "Products ready";


        },

        undefined,

        function(error) {

            console.error(
                name +
                " load error",
                error
            );

            document.getElementById(
                "error"
            ).style.display =
                "block";

            document.getElementById(
                "error"
            ).innerText +=
                name +
                " failed to load\n\n" +
                error.message +
                "\n\n";

        }

    );

}


// =====================================================
// LOAD BOTH
// =====================================================

loadProduct(
    "sofa",
    "./sofa.fbx"
);

loadProduct(
    "table",
    "./table.fbx"
);


// =====================================================
// PRODUCT BUTTONS
// =====================================================

document
.querySelectorAll(".product")
.forEach(
    button => {

        button.addEventListener(
            "click",
            function() {

                const name =
                    this.dataset.product;


                if (!products[name]) {

                    alert(
                        "Product is still loading."
                    );

                    return;

                }


                selectedProduct =
                    products[name];


                // Hide all products

                Object.values(
                    products
                ).forEach(
                    p => {
                        p.visible = false;
                    }
                );


                // Show selected

                selectedProduct.visible =
                    true;


                // Start with model
                // at origin

                selectedProduct.position.set(
                    0,
                    0,
                    0
                );


                // Highlight button

                document
                .querySelectorAll(".product")
                .forEach(
                    b => {
                        b.classList.remove(
                            "selected"
                        );
                    }
                );


                this.classList.add(
                    "selected"
                );


                document.getElementById(
                    "instruction"
                ).innerText =
                    "Move phone to find floor, then tap to place.";

            }

        );

    }
);


// =====================================================
// AR BUTTON
// =====================================================

const arButton =
    ARButton.createButton(
        renderer,
        {
            requiredFeatures: [
                "hit-test"
            ],

            optionalFeatures: [
                "dom-overlay"
            ],

            domOverlay: {
                root: document.body
            }
        }
    );


document.body.appendChild(
    arButton
);


// =====================================================
// RETICLE
// =====================================================

const reticle =
    new THREE.Mesh(

        new THREE.RingGeometry(
            0.08,
            0.1,
            32
        ),

        new THREE.MeshBasicMaterial({
            color: 0xffffff
        })

    );

reticle.rotation.x =
    -Math.PI / 2;

reticle.matrixAutoUpdate =
    false;

reticle.visible =
    false;

scene.add(
    reticle
);


// =====================================================
// AR CONTROLLER
// =====================================================

const controller =
    renderer.xr.getController(
        0
    );

scene.add(
    controller
);


// =====================================================
// TAP TO PLACE
// =====================================================

controller.addEventListener(
    "select",
    function() {

        if (
            !selectedProduct ||
            !reticle.visible
        ) {
            return;
        }


        // Copy reticle position

        selectedProduct.position.setFromMatrixPosition(
            reticle.matrix
        );


        // Put model on floor

        selectedProduct.position.y =
            0;


        selectedProduct.visible =
            true;


        document.getElementById(
            "instruction"
        ).innerText =
            "Placed. Select another product.";

    }
);


// =====================================================
// XR SESSION
// =====================================================

renderer.xr.addEventListener(
    "sessionstart",
    function() {

        document.getElementById(
            "info"
        ).style.display =
            "none";

        document.getElementById(
            "instruction"
        ).style.display =
            "block";

    }
);


// =====================================================
// HIT TEST
// =====================================================

let hitTestSource = null;

let hitTestSourceRequested =
    false;


renderer.setAnimationLoop(
    function(
        timestamp,
        frame
    ) {

        if (
            frame &&
            renderer.xr.isPresenting
        ) {

            const session =
                renderer.xr.getSession();

            const referenceSpace =
                renderer.xr.getReferenceSpace();


            if (
                !hitTestSourceRequested
            ) {

                session
                .requestReferenceSpace(
                    "viewer"
                )
                .then(
                    function(
                        viewerSpace
                    ) {

                        session
                        .requestHitTestSource({
                            space:
                                viewerSpace
                        })
                        .then(
                            function(
                                source
                            ) {

                                hitTestSource =
                                    source;

                            }
                        );

                    }
                );


                hitTestSourceRequested =
                    true;

            }


            if (hitTestSource) {

                const results =
                    frame.getHitTestResults(
                        hitTestSource
                    );


                if (
                    results.length > 0
                ) {

                    const hit =
                        results[0];


                    const pose =
                        hit.getPose(
                            referenceSpace
                        );


                    reticle.visible =
                        true;


                    reticle.matrix.fromArray(
                        pose.transform.matrix
                    );

                }
                else {

                    reticle.visible =
                        false;

                }

            }

        }


        renderer.render(
            scene,
            camera
        );

    }
);


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
